networks:
  smart-home-net:
    driver: bridge

services:
  # 1. قاعدة البيانات (مخصصة ومحفوظة على القرص الصلب)
  postgres:
    image: postgres:14-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: smarthome_user
      POSTGRES_PASSWORD: smarthome_password
      POSTGRES_DB: smarthome_energy
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Asia/Riyadh  # ⏰ توحيد المنطقة الزمنية لقاعدة البيانات
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data  # 💾 حفظ البيانات على قرصك E للأبد!
    networks:
      - smart-home-net

  # 2. مستقبل البيانات الفورية (كافكا)
  kafka:
    image: apache/kafka:3.7.0
    container_name: smarthome-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://smarthome-kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      TZ: Asia/Riyadh  # ⏰ توحيد المنطقة الزمنية لكافكا
    networks:
      - smart-home-net

  # 3. بيئة المعالجة والـ ETL (سبارك وجوبيتر + خادم الـ API لتشغيل الـ Notebooks)
  spark-notebook:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: smarthome-spark-notebook
    ports:
      - "8888:8888"
      - "8000:8000" # 👈 فتح منفذ الـ API ليتواصل معه إيرفلو والـ Host
    environment:
      TZ: Asia/Riyadh  # ⏰ إجبار محرك سبارك وجوبيتر على مطابقة ساعة جهازك
    volumes:
      - .:/home/jovyan/work
      - ./spark-ivy-cache:/home/jovyan/.ivy2
    # 👈 السطر التالي يقوم بتثبيت مكتبات FastAPI وتشغيل خادم الويب app.py بالخلفية فوراً عند الإقلاع
    command: >
      bash -c "
      pip install fastapi uvicorn papermill --quiet &&
      (python /home/jovyan/work/processing/app.py &) &&
      start-notebook.sh --NotebookApp.token=''
      "
    networks:
      - smart-home-net

  # 4. لوحة التحليلات والمؤشرات المركزية (Metabase)
  metabase:
    image: metabase/metabase:v0.46.6
    container_name: smarthome-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: smarthome_energy
      MB_DB_PORT: 5432
      MB_DB_USER: smarthome_user
      MB_DB_PASS: smarthome_password
      MB_DB_HOST: postgres
      TZ: Asia/Riyadh  # ⏰ توحيد التوقيت لتعرض لوحة التحكم البيانات الحية بشكل دقيق
    networks:
      - smart-home-net
    depends_on:
      - postgres

  # ==============================================================================
  # 🚀 خدمات أباتشي إير فلو الذكية (تم إزالة الربط المعقد للـ Socket هنا بالكامل)
  # ==============================================================================

  # أ. واجهة المستخدم الرسومية لإير فلو (Airflow Webserver)
  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: smarthome-airflow-webserver
    user: "0:0"
    restart: always
    command: bash -c "airflow db migrate && (airflow users create --username airflow --password airflow --firstname Admin --lastname Admin --role Admin --email admin@smarthome.local || true) && airflow webserver"
    ports:
      - "8880:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://smarthome_user:smarthome_password@postgres:5432/airflow_db
      PYTHONPATH: /opt/airflow/custom_libs
      TZ: Asia/Riyadh  # ⏰ لضمان جدولة المهام بناءً على توقيتك المحلي
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./processing:/opt/airflow/processing
      - ./airflow/custom_libs:/opt/airflow/custom_libs
    networks:
      - smart-home-net
    depends_on:
      - postgres

  # ب. المايسترو والمجدول التلقائي (Airflow Scheduler)
  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: smarthome-airflow-scheduler
    user: "0:0"
    restart: always
    command: scheduler
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://smarthome_user:smarthome_password@postgres:5432/airflow_db
      PYTHONPATH: /opt/airflow/custom_libs
      TZ: Asia/Riyadh  # ⏰ مطابقة ساعة المجدول مع الويب سيرفر لمنع أي تأخير في الـ DAGs
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./processing:/opt/airflow/processing
      - ./airflow/custom_libs:/opt/airflow/custom_libs
    networks:
      - smart-home-net
    depends_on:
      - airflow-webserver

  # ==============================================================================
  # ⭐ الخدمة المضافة حديثاً لتشغيل البث اللحظي للسبارك تلقائياً ومراقبته 24/7
  # ==============================================================================
  spark-energy-streamer:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: smarthome-spark-streamer
    user: "0:0" # لضمان الصلاحيات الكاملة في نظام الملفات وحذف الـ Checkpoints
    restart: always
    environment:
      TZ: Asia/Riyadh
    command: >
      spark-submit 
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0 
      /home/jovyan/work/processing/spark_stream.py
    volumes:
      - .:/home/jovyan/work
      - ./spark-ivy-cache:/home/jovyan/.ivy2
    networks:
      - smart-home-net
    depends_on:
      - kafka
      - postgres